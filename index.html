<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ABUADAnony — Send Anonymous Message</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Playfair+Display:wght@500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #07090f;
      --surface: #0f1420;
      --surface-2: #161d2e;
      --text: #e8ecf4;
      --text-muted: #8b95a8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --border: rgba(255,255,255,0.06);
      --radius: 12px;
      --shadow: 0 8px 32px rgba(0,0,0,0.4);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Inter', system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
      overflow-x: hidden;
    }

    .container {
      max-width: 640px;
      margin: 0 auto;
      padding: 2.5rem 1.25rem 4rem;
    }

    header {
      text-align: center;
      margin-bottom: 2.75rem;
      animation: fadeDown 0.7s ease both;
    }

    /* Logo Image */
    .logo-img {
      width: 72px;
      height: 72px;
      margin: 0 auto 1.1rem;
      object-fit: contain;
      border-radius: 18px;
      display: block;
      box-shadow: var(--shadow);
      transition: transform 0.35s ease, box-shadow 0.35s ease;
      animation: logoPulse 4s ease-in-out infinite;
      background: var(--surface);
    }

    .logo-img:hover {
      transform: scale(1.05);
      box-shadow: 0 12px 40px rgba(59, 130, 246, 0.15);
    }

    .logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.9rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin-bottom: 0.35rem;
    }

    .tagline {
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 1.85rem;
      box-shadow: var(--shadow);
      animation: fadeUp 0.7s ease 0.15s both;
    }

    h2 {
      font-size: 1.15rem;
      font-weight: 550;
      margin-bottom: 1.25rem;
    }

    textarea {
      width: 100%;
      min-height: 130px;
      background: var(--surface-2);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 1rem 1.1rem;
      color: var(--text);
      font-family: inherit;
      font-size: 0.95rem;
      resize: vertical;
      transition: border-color 0.25s, box-shadow 0.25s;
    }

    textarea:focus {
      outline: none;
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
    }

    textarea::placeholder {
      color: var(--text-muted);
    }

    .image-upload {
      margin-top: 1rem;
    }

    .image-label {
      display: flex;
      align-items: center;
      gap: 0.6rem;
      background: var(--surface-2);
      border: 1px dashed var(--border);
      border-radius: 10px;
      padding: 0.85rem 1.1rem;
      cursor: pointer;
      transition: border-color 0.25s, background 0.25s;
      font-size: 0.9rem;
      color: var(--text-muted);
    }

    .image-label:hover {
      border-color: var(--accent);
      background: rgba(59, 130, 246, 0.05);
      color: var(--text);
    }

    .image-label svg {
      width: 18px;
      height: 18px;
      flex-shrink: 0;
    }

    #image-input {
      display: none;
    }

    .image-preview {
      margin-top: 0.9rem;
      position: relative;
      display: none;
      border-radius: 10px;
      overflow: hidden;
      border: 1px solid var(--border);
    }

    .image-preview img {
      width: 100%;
      max-height: 260px;
      object-fit: contain;
      background: #0a0c14;
      display: block;
    }

    .remove-image {
      position: absolute;
      top: 8px;
      right: 8px;
      background: rgba(0,0,0,0.7);
      border: none;
      color: white;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      font-size: 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
    }

    .remove-image:hover {
      background: #ef4444;
    }

    .compress-info {
      font-size: 0.78rem;
      color: var(--text-muted);
      margin-top: 0.5rem;
      display: none;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--accent);
      color: white;
      border: none;
      border-radius: 10px;
      padding: 0.9rem 1.5rem;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.25s, transform 0.2s, box-shadow 0.25s;
      width: 100%;
      margin-top: 1.25rem;
    }

    .btn:hover {
      background: var(--accent-hover);
      box-shadow: 0 6px 20px rgba(37, 99, 235, 0.3);
    }

    .btn:active { transform: scale(0.98); }
    .btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      box-shadow: none;
    }

    .status {
      text-align: center;
      font-size: 0.85rem;
      margin-top: 1.1rem;
      color: var(--text-muted);
      min-height: 1.3em;
      transition: all 0.3s ease;
    }

    .status.success {
      color: #22c55e;
      animation: statusPop 0.4s ease;
    }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-18px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(22px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes logoPulse {
      0%, 100% { box-shadow: 0 8px 32px rgba(0,0,0,0.4); }
      50% { box-shadow: 0 8px 32px rgba(59, 130, 246, 0.12); }
    }

    @keyframes statusPop {
      0% { opacity: 0; transform: scale(0.9); }
      100% { opacity: 1; transform: scale(1); }
    }

    @media (max-width: 480px) {
      .container { padding: 2rem 1rem 3rem; }
      .logo { font-size: 1.65rem; }
      .logo-img { width: 64px; height: 64px; }
      .card { padding: 1.5rem; }
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <!-- Just place your logo.png in the same folder -->
      <img src="logo.png" alt="ABUADAnony Logo" class="logo-img">

      <div class="logo">ABUADAnony</div>
      <div class="tagline">Anonymous. Secure. Discreet.</div>
    </header>

    <div class="card">
      <h2>Send an anonymous message</h2>
      <form id="message-form">
        <textarea 
          id="message-input" 
          placeholder="Type your message here… (optional if you send an image)"
        ></textarea>

        <div class="image-upload">
          <label for="image-input" class="image-label">
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.8" d="M4 16l4.586-4.586a2 2 0 012.828 0L16 16m-2-2l1.586-1.586a2 2 0 012.828 0L20 14m-6-6h.01M6 20h12a2 2 0 002-2V6a2 2 0 00-2-2H6a2 2 0 00-2 2v12a2 2 0 002 2z" />
            </svg>
            <span id="image-label-text">Add an image (optional)</span>
          </label>
          <input type="file" id="image-input" accept="image/*" />
          
          <div class="image-preview" id="image-preview">
            <img id="preview-img" src="" alt="Preview" />
            <button type="button" class="remove-image" id="remove-image">×</button>
          </div>
          <div class="compress-info" id="compress-info"></div>
        </div>

        <button type="submit" class="btn" id="send-btn">Send Anonymously</button>
      </form>
      <div class="status" id="send-status"></div>
    </div>
  </div>

  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.14.0/firebase-firestore-compat.js"></script>

  <script>
    // 🔑 REPLACE WITH YOUR FIREBASE CONFIG
    const firebaseConfig = {
      apiKey: "AIzaSyDR25xf3aTU60Ea9c3n_kTYXkWH_-4iU6k",
    authDomain: "newproject-284a1.firebaseapp.com",
    projectId: "newproject-284a1",
    storageBucket: "newproject-284a1.firebasestorage.app",
    messagingSenderId: "416724467665",
    appId: "1:416724467665:web:7e255ce782371e56a6eaf0"
  };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore();

    const form = document.getElementById('message-form');
    const input = document.getElementById('message-input');
    const imageInput = document.getElementById('image-input');
    const imagePreview = document.getElementById('image-preview');
    const previewImg = document.getElementById('preview-img');
    const removeBtn = document.getElementById('remove-image');
    const labelText = document.getElementById('image-label-text');
    const compressInfo = document.getElementById('compress-info');
    const btn = document.getElementById('send-btn');
    const status = document.getElementById('send-status');

    let selectedImageBase64 = null;

    // ========== IMAGE COMPRESSION ==========
    function compressImage(file, maxWidth = 1000, maxHeight = 1000, quality = 0.65) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);

        reader.onload = (event) => {
          const img = new Image();
          img.src = event.target.result;

          img.onload = () => {
            let width = img.width;
            let height = img.height;

            if (width > height) {
              if (width > maxWidth) {
                height = Math.round((height * maxWidth) / width);
                width = maxWidth;
              }
            } else {
              if (height > maxHeight) {
                width = Math.round((width * maxHeight) / height);
                height = maxHeight;
              }
            }

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;

            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);

            const compressedBase64 = canvas.toDataURL('image/jpeg', quality);
            resolve(compressedBase64);
          };

          img.onerror = reject;
        };

        reader.onerror = reject;
      });
    }

    imageInput.addEventListener('change', async (e) => {
      const file = e.target.files[0];
      if (!file) return;

      labelText.textContent = 'Compressing image…';
      compressInfo.style.display = 'none';

      try {
        selectedImageBase64 = await compressImage(file, 1000, 1000, 0.65);

        previewImg.src = selectedImageBase64;
        imagePreview.style.display = 'block';
        labelText.textContent = file.name;

        const sizeInKB = Math.round((selectedImageBase64.length * 0.75) / 1024);
        compressInfo.textContent = `Compressed to ~${sizeInKB} KB`;
        compressInfo.style.display = 'block';

      } catch (err) {
        console.error(err);
        alert('Failed to process image. Please try another one.');
        resetImage();
      }
    });

    function resetImage() {
      selectedImageBase64 = null;
      imageInput.value = '';
      imagePreview.style.display = 'none';
      previewImg.src = '';
      labelText.textContent = 'Add an image (optional)';
      compressInfo.style.display = 'none';
    }

    removeBtn.addEventListener('click', resetImage);

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const text = input.value.trim();

      if (!text && !selectedImageBase64) {
        status.textContent = 'Please write a message or add an image.';
        status.className = 'status';
        return;
      }

      btn.disabled = true;
      status.textContent = 'Sending…';
      status.className = 'status';

      try {
        const messageData = {
          text: text || '',
          createdAt: firebase.firestore.FieldValue.serverTimestamp()
        };

        if (selectedImageBase64) {
          messageData.image = selectedImageBase64;
        }

        await db.collection('messages').add(messageData);

        input.value = '';
        resetImage();

        status.textContent = 'Message sent anonymously ✓';
        status.className = 'status success';

        setTimeout(() => {
          status.textContent = '';
          status.className = 'status';
        }, 3200);
      } catch (err) {
        console.error(err);
        status.textContent = 'Failed to send. Image may still be too large.';
        status.className = 'status';
      } finally {
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
