<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quick Text QR Code Generator</title>
  <script src="https://cdn.jsdelivr.net/npm/qrcode/build/qrcode.min.js"></script>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f0f0f;
      color: #e0e0e0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .container {
      background: #1a1a1a;
      border-radius: 16px;
      padding: 32px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
      border: 1px solid #2a2a2a;
    }
    h1 {
      font-size: 1.5rem;
      font-weight: 600;
      margin-bottom: 8px;
      text-align: center;
      color: #fff;
    }
    .subtitle {
      text-align: center;
      color: #888;
      font-size: 0.9rem;
      margin-bottom: 24px;
    }
    label {
      display: block;
      font-size: 0.85rem;
      color: #aaa;
      margin-bottom: 6px;
    }
    textarea {
      width: 100%;
      height: 90px;
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #333;
      background: #111;
      color: #fff;
      font-size: 1rem;
      resize: vertical;
      font-family: inherit;
      transition: border-color 0.2s;
    }
    textarea:focus {
      outline: none;
      border-color: #3b82f6;
    }
    .controls {
      display: flex;
      gap: 12px;
      margin-top: 16px;
    }
    button {
      flex: 1;
      padding: 12px 16px;
      border: none;
      border-radius: 8px;
      font-size: 0.95rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
    }
    button:active {
      transform: scale(0.98);
    }
    #generateBtn {
      background: #3b82f6;
      color: white;
    }
    #generateBtn:hover {
      background: #2563eb;
    }
    #downloadBtn {
      background: #222;
      color: #ddd;
      border: 1px solid #333;
    }
    #downloadBtn:hover {
      background: #2a2a2a;
    }
    #downloadBtn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .qr-wrapper {
      margin-top: 28px;
      display: flex;
      justify-content: center;
      min-height: 220px;
      align-items: center;
    }
    #qrcode {
      background: white;
      padding: 12px;
      border-radius: 12px;
      display: none;
    }
    #qrcode canvas {
      display: block;
    }
    .placeholder {
      color: #555;
      font-size: 0.9rem;
      text-align: center;
    }
    .footer {
      margin-top: 20px;
      text-align: center;
      font-size: 0.75rem;
      color: #555;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>QR Code Generator</h1>
    <p class="subtitle">Type any text or URL → get a QR code instantly</p>

    <label for="text">Text or URL</label>
    <textarea id="text" placeholder="https://example.com or any text..." autofocus></textarea>

    <div class="controls">
      <button id="generateBtn">Generate</button>
      <button id="downloadBtn" disabled>Download PNG</button>
    </div>

    <div class="qr-wrapper">
      <div id="qrcode"></div>
      <div class="placeholder" id="placeholder">Your QR code will appear here</div>
    </div>

    <p class="footer">Works fully offline after first load · Client-side only</p>
  </div>

  <script>
    const textInput = document.getElementById('text');
    const generateBtn = document.getElementById('generateBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const qrcodeDiv = document.getElementById('qrcode');
    const placeholder = document.getElementById('placeholder');

    let currentCanvas = null;

    function generate() {
      const text = textInput.value.trim();
      if (!text) {
        alert('Please enter some text first.');
        return;
      }

      // Clear previous
      qrcodeDiv.innerHTML = '';
      placeholder.style.display = 'none';
      qrcodeDiv.style.display = 'block';

      QRCode.toCanvas(document.createElement('canvas'), text, {
        width: 220,
        margin: 2,
        color: {
          dark: '#000000',
          light: '#ffffff'
        },
        errorCorrectionLevel: 'M'
      }, function (error, canvas) {
        if (error) {
          console.error(error);
          alert('Failed to generate QR code.');
          return;
        }
        currentCanvas = canvas;
        qrcodeDiv.appendChild(canvas);
        downloadBtn.disabled = false;
      });
    }

    function download() {
      if (!currentCanvas) return;
      const link = document.createElement('a');
      link.download = 'qrcode.png';
      link.href = currentCanvas.toDataURL('image/png');
      link.click();
    }

    generateBtn.addEventListener('click', generate);
    downloadBtn.addEventListener('click', download);

    // Generate on Enter (Ctrl/Cmd + Enter also works)
    textInput.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey || !e.shiftKey)) {
        e.preventDefault();
        generate();
      }
    });

    // Live generate after a short pause while typing
    let debounce;
    textInput.addEventListener('input', () => {
      clearTimeout(debounce);
      debounce = setTimeout(() => {
        if (textInput.value.trim()) generate();
      }, 400);
    });
  </script>
</body>
</html>
